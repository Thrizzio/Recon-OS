name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List tracked Markdown documents
        run: |
          echo "Markdown documents under version control:"
          git ls-files | grep -E '\.md$' | sort

      - name: Guard against placeholder content
        run: |
          if grep -rniE 'lorem ipsum|<<<<<<<|>>>>>>>' --include='*.md' .; then
            echo "::error::Placeholder or conflict markers detected in Markdown."
            exit 1
          fi
          echo "No placeholder or conflict markers found."

  workspace:
    name: Validate workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package boundaries
        run: pnpm run check:boundaries

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test
